name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend pytest suite
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend + ai_ml (with dev deps)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -e "backend[dev]" -e ai_ml --quiet

      - name: Run pytest
        run: python -m pytest tests/ -q --no-header
